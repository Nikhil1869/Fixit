services:
  - type: web
    name: fixit-app
    env: node
    region: oregon # You can change this to your preferred region (e.g., frankfurt, ohio, singapore)
    buildCommand: corepack enable && yarn install --frozen-lockfile && yarn build
    startCommand: yarn start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: MONGODB_URI
        sync: false # Set this securely in the Render dashboard
      - key: AUTH_SECRET
        sync: false # Set this securely in the Render dashboard
      - key: AUTH_URL
        sync: false # Required: exact canonical HTTPS origin for this deployment
      - key: AUTH_TRUST_HOST
        value: "true"
